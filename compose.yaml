services:
  tabellonetreni:
    image: ghcr.io/m4rc02u1f4a4/tabellonetreni:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      STATO_LINEE_URL: http://statolinee:8081
    # Il servizio non scrive niente e non tiene stato oltre la cache in memoria.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Stessa immagine, altro binario: segue lo stato delle linee Trenord e lo
  # serve al tabellone. Sta a parte perché interroga Trenord a ritmo suo e una
  # volta sola per tutti — se il tabellone scalasse a due repliche, dentro ci
  # sarebbero due poller — e perché è qui che finiranno gli abbonamenti alle
  # notifiche, cioè lo stato su disco che il tabellone non vuole avere.
  statolinee:
    image: ghcr.io/m4rc02u1f4a4/tabellonetreni:latest
    entrypoint: ["/statolinee"]
    restart: unless-stopped
    environment:
      # Qui dentro finiscono gli abbonamenti alle notifiche e le chiavi con cui
      # si spediscono: il servizio se le genera al primo avvio, non c'e' niente
      # da creare a mano. Devono sopravvivere ai riavvii, che sono uno per
      # rilascio. Senza DATI il servizio parte lo stesso e tiene tutto in
      # memoria: va bene per provare, non in produzione.
      DATI: /dati
    volumes:
      - abbonamenti:/dati
    # L'immagine gira come nonroot (uid 65532) e un volume Docker appena creato
    # appartiene a root: la prima volta va ceduto, altrimenti il servizio parte
    # e fallisce solo quando qualcuno accende una campanella. Il chown lo deve
    # fare un'altra immagine, perche' questa e' distroless e non ha una shell:
    #   docker run --rm -v tabellonetreni_abbonamenti:/dati alpine \
    #     chown -R 65532:65532 /dati
    # In Kubernetes non serve: lo fa fsGroup.
    # Nessuna porta pubblicata: ci parla solo il tabellone, dalla rete interna.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  abbonamenti:
