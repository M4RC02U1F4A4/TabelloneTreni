<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="Tabelloni RFI in versione leggera per telefono, con filtro per stazione di arrivo.">
<meta name="color-scheme" content="dark light">
<title>Tabellone Treni</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="testa" class="testa"></header>
<main id="app" class="app" aria-live="polite"></main>

<!-- Il selettore stazione è un pannello a tutto schermo invece di una <select>:
     con 2435 voci il menu nativo del telefono è inservibile senza ricerca. -->
<div id="scelta" class="scelta" hidden role="dialog" aria-modal="true" aria-label="Scegli la stazione">
  <div class="scelta-testa">
    <input id="cerca" class="cerca" type="search" inputmode="search" autocomplete="off"
           autocorrect="off" spellcheck="false" placeholder="Cerca stazione" aria-label="Cerca stazione">
    <button id="chiudi-scelta" class="btn-testo" type="button">Annulla</button>
  </div>
  <ul id="risultati-scelta" class="elenco-scelta"></ul>
</div>

<script src="app.js" defer></script>
</body>
</html>
